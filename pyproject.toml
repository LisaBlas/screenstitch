[project]
name = "screenstitch"
version = "0.1.0"
description = "Turn overlapping gameplay screenshots into seamless, UI-free panoramas"
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.8",
    "numpy>=1.24",
    "Pillow>=10.0",
]

[project.scripts]
screenstitch = "screenstitch.cli:main"
